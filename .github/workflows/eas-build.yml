name: EAS Build

on:
  # Push tag v1.2.3 -> build production (Android + iOS) di EAS
  push:
    tags: ['v*']
  # Typecheck setiap PR ke develop/master
  pull_request:
    branches: [develop, master]
  # Jalankan manual dari tab Actions
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        type: choice
        options: [production, preview, development]
        default: preview
      platform:
        description: 'Platform'
        type: choice
        options: [all, android, ios]
        default: android

concurrency:
  group: eas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tag harus sama dengan `version` di app.config.ts (v1.0.0 <-> '1.0.0')
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP_VERSION=$(grep -oP "^\s*version: '\K[^']+" app.config.ts)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "app.config.ts version=$APP_VERSION, tag=$TAG_VERSION"
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME tidak sama dengan version '$APP_VERSION' di app.config.ts"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: EAS build
        run: |
          PROFILE="${{ inputs.profile || 'production' }}"
          PLATFORM="${{ inputs.platform || 'all' }}"
          echo "Building profile=$PROFILE platform=$PLATFORM"
          eas build --profile "$PROFILE" --platform "$PLATFORM" --non-interactive --no-wait
